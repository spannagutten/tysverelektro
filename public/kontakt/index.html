<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kontakt oss | Tysvær Elektro</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <div class="header-space">

        <header>

            <img src="../images/te_logo_removebg.png" alt="Tysvær Elektro logo">

            <button class="menu-button" aria-label="Åpne meny" aria-expanded="false">
                ☰
            </button>

            <nav>
                <a href="/">Hjem</a>
                <a href="/tjenester/">Våre tjenester</a>
                <a href="/kontakt/">Kontakt oss</a>
            </nav>

        </header>

    </div>


    <main>

        <section class="section contact">

            <h1>Kontakt oss</h1>

            <p>
                Ta gjerne kontakt med oss dersom du trenger hjelp
                med elektriske installasjoner, service eller feilsøking.
            </p>

            <p>
                <strong>Telefon:</strong><br>
                XX XX XX XX
            </p>

            <p>
                <strong>E-post:</strong><br>
                <a href="mailto:post@tysverelektro.no">
                    post@tysverelektro.no
                </a>
            </p>

            <p>
                Vi holder til i Tysvær og utfører oppdrag
                på Haugalandet.
            </p>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Tysvær Elektro
        </p>

    </footer>


    <script>
        const header = document.querySelector("header");
        const menuButton = document.querySelector(".menu-button");
        const nav = document.querySelector("nav");

        window.addEventListener("scroll", function () {

            if (window.innerWidth > 700) {

                if (window.scrollY > 50) {
                    header.classList.add("scrolled");
                } else {
                    header.classList.remove("scrolled");
                }

            }

        });

        menuButton.addEventListener("click", function () {

            nav.classList.toggle("open");

            const menuIsOpen = nav.classList.contains("open");

            menuButton.textContent = menuIsOpen ? "✕" : "☰";
            menuButton.setAttribute("aria-expanded", menuIsOpen);

        });
    </script>

</body>

</html>
